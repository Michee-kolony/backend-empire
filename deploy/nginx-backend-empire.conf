# Directives à ajouter dans le bloc `server { ... }` de backend-empire.cloud
# (ex : /etc/nginx/sites-available/backend-empire), à côté du proxy_pass existant.
# Puis : sudo nginx -t && sudo systemctl reload nginx

# Taille max d'une requête. Par défaut nginx limite à 1 Mo et répond 413 avant même
# d'atteindre Express. Une propriété peut envoyer jusqu'à 5 photos (5 Mo) + 6 documents
# (10 Mo) = 85 Mo : voir les limites dans middleware/upload.js et routes/propriete.js.
client_max_body_size 100M;

# Laisse le temps d'envoyer les gros fichiers sur une connexion lente
client_body_timeout 120s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
