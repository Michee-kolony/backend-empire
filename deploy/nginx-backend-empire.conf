# Directives à ajouter dans le bloc `server { ... }` de backend-empire.cloud
# (ex : /etc/nginx/sites-available/backend-empire), à côté du proxy_pass existant.
# Puis : sudo nginx -t && sudo systemctl reload nginx

# Taille max d'une requête. Par défaut nginx limite à 1 Mo et répond 413 avant même
# d'atteindre Express. Une propriété peut envoyer jusqu'à 5 photos (20 Mo) + 6 documents
# (20 Mo) = 220 Mo : voir les limites dans middleware/upload.js et routes/propriete.js.
client_max_body_size 250M;

# Laisse le temps d'envoyer les gros fichiers sur une connexion lente
client_body_timeout 300s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Quand nginx refuse lui-même une requête trop lourde, sa page 413 n'a pas
# d'en-tête CORS : le navigateur affiche alors une fausse « erreur CORS ».
# On renvoie à la place un JSON lisible par le frontend, avec l'en-tête CORS.
error_page 413 = @fichier_trop_lourd;
location @fichier_trop_lourd {
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;
    return 413 '{"success":false,"message":"Fichier trop volumineux (20 Mo max par photo ou document)"}';
}

